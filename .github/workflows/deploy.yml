name: Deploy Space Portfolio to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages with PAT
        if: ${{ secrets.PAGES_PAT != '' }}
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_PAT }}
          enablement: true

      - name: Skip Configure Pages
        if: ${{ secrets.PAGES_PAT == '' }}
        run: |
          echo "PAGES_PAT secret is not set. Skipping Pages enablement."
          echo "If GitHub Pages is not already enabled for this repository, open repository settings and enable Pages manually."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
